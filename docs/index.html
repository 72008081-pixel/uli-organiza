function today(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Lima',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return p.find(x=>x.type==='year').value+'-'+p.find(x=>x.type==='month').value+'-'+p.find(x=>x.type==='day').value;}
function dt(s){return new Date(s+'T12:00:00');}function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}function add(s,n){const d=dt(s);d.setDate(d.getDate()+n);return iso(d);}function monday(s){return add(s,-((dt(s).getDay()+6)%7));}function label(s,opts={day:'numeric',month:'long'}){return dt(s).toLocaleDateString('es-PE',opts);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function edit(id){draft=structuredClone(tasks.find(t=>t.id===id));showEditor();}
function options(values,value){return values.map(v=>'<option '+(v===value?'selected':'')+' value="'+esc(v)+'">'+esc(v||'No repetir')+'</option>').join('');}
function showEditor(){const d=draft;const dialog=document.querySelector('#editor');dialog.innerHTML='<form class="modal" id="taskForm"><header><div><span class="eyebrow">#'+String(d.number).padStart(2,'0')+' · TU LISTA ÚNICA</span><h2>Dale su lugar.</h2></div><button type="button" onclick="closeEditor()" aria-label="Cerrar edición">×</button></header><label>¿Qué quieres hacer?<input name="title" value="'+esc(d.title)+'" required maxlength="500" autofocus></label><div class="form-grid"><label>Espacio<select name="area">'+options(A,d.area)+'</select></label><label>Tipo<select name="kind">'+options(K,d.kind)+'</select></label><label>Día para hacerlo<input name="date" type="date" value="'+esc(d.date)+'"></label><label>Plazo real (si existe)<input name="deadline" type="date" value="'+esc(d.deadline)+'"></label><label>Prioridad<select name="priority">'+options(['Alta','Media','Baja'],d.priority)+'</select></label><label>Estado<select name="status">'+options(['Pendiente','En curso','Hecho','Archivado'],d.status)+'</select></label><label>Repetición<select name="repeat">'+options(['','Diaria','Semanal','Mensual'],d.repeat)+'</select></label><label>Presupuesto estimado S/ (compras)<input name="cost" type="number" min="0" step="0.01" value="'+esc(d.cost)+'"></label></div><label>Notas / pasos / texto de la foto<textarea name="notes" rows="4" maxlength="10000">'+esc(d.notes)+'</textarea></label><p class="footnote">Origen: '+esc(d.source)+(d.proposed?' · Fecha sugerida al organizar; confirma tu plazo.':'')+'<br>Una repetición crea la siguiente tarea al marcar la casilla.</p><footer><button type="button" class="text-button" onclick="archiveDraft()">▧ Archivar</button><button class="primary">Guardar tarea ✓</button></footer></form>';if(!dialog.open)dialog.showModal();dialog.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let t={...draft};for(const [k,v] of f)t[k]=String(v);if(t.date!==draft.date)t.proposed=false;if(!valid(t)){alert('Revisa los campos.');return;}const next=tasks.some(x=>x.id===t.id)?tasks.map(x=>x.id===t.id?t:x):[...tasks,t];if(persist(next))closeEditor();};}
function closeEditor(){document.querySelector('#editor').close();draft=null;}
function archiveDraft(){if(!tasks.some(t=>t.id===draft.id)){closeEditor();return;}if(persist(tasks.map(t=>t.id===draft.id?{...t,status:'Archivado'}:t),'Archivada. Puedes recuperarla en Archivo.'))closeEditor();}
function complete(id){const t=tasks.find(t=>t.id===id),done=t.status!=='Hecho';let next=tasks.map(t=>t.id===id?{...t,status:done?'Hecho':'Pendiente'}:t);if(done&&t.repeat){let date=t.date||today();if(t.repeat==='Diaria')date=add(date,1);else if(t.repeat==='Semanal')date=add(date,7);else{const d=dt(date),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));date=iso(d);}next.push({...t,id:crypto.randomUUID?crypto.randomUUID():'task-'+Date.now(),number:Math.max(...tasks.map(x=>x.number))+1,status:'Pendiente',date,proposed:false});}persist(next,done&&t.repeat?'Hecho. Siguiente repetición creada.':'Estado actualizado');}
function card(t,compact=false){return '<article class="task '+(compact?'compact ':'')+(t.status==='Hecho'?'done':'')+'"><button class="check '+(t.status==='Hecho'?'checked':'')+'" data-complete="'+esc(t.id)+'" aria-label="'+esc((t.status==='Hecho'?'Reabrir ':'Completar ')+t.title)+'">'+(t.status==='Hecho'?'✓':'')+'</button><button class="task-content" data-edit="'+esc(t.id)+'"><span class="task-title"><small>#'+String(t.number).padStart(2,'0')+'</small> '+esc(t.title)+'</span><span class="task-meta"><span class="tag '+esc(t.area)+'">'+esc(t.area)+'</span>'+(t.kind==='Compra'?'<span>Compra</span>':'')+(t.date&&!compact?'<span>'+label(t.date)+(t.proposed?' · sugerida':'')+'</span>':'')+(t.deadline?'<span style="color:#b46a4a">Límite: '+label(t.deadline)+'</span>':'')+(t.status==='En curso'?'<span>En curso</span>':'')+(t.repeat?'<span>↻ '+t.repeat+'</span>':'')+(t.cost?'<span>S/ '+Number(t.cost).toFixed(2)+'</span>':'')+'</span></button><span class="priority '+t.priority+'" title="Prioridad '+t.priority+'">'+(t.priority==='Alta'?'↑':'•')+'</span></article>';}
function navigate(n){if(view==='Mes'){let d=dt(anchor);d.setDate(1);d.setMonth(d.getMonth()+n);anchor=iso(d);}else anchor=add(anchor,7*n);render();}
function content(){let list=sorted(tasks.filter(matches).filter(t=>view==='Hechas'?t.status==='Hecho':view==='Archivo'?t.status==='Archivado':active(t)).filter(t=>view==='Hoy'?t.date&&t.date<=today():view==='Compras'?t.kind==='Compra':view==='Sin fecha'?!t.date:true));
if(view==='Semana'||view==='Mes'){const week=monday(anchor);let s='<div class="calendar-controls"><button aria-label="Periodo anterior" onclick="navigate(-1)">❮</button><strong>'+(view==='Mes'?label(anchor,{month:'long',year:'numeric'}):label(week)+' — '+label(add(week,6)))+'</strong><button aria-label="Periodo siguiente" onclick="navigate(1)">❯</button><button class="text-button" onclick="anchor=today();render()">Hoy</button></div>';
if(view==='Semana'){return s+'<div class="week-grid">'+Array.from({length:7},(_,i)=>{const d=add(week,i),items=sorted(tasks.filter(active).filter(matches).filter(t=>t.date===d));return '<div class="day-column '+(d===today()?'is-today':'')+'"><header><span>'+label(d,{weekday:'short'})+'</span><strong>'+dt(d).getDate()+'</strong><button onclick="newTask(\''+d+'\')" aria-label="Añadir tarea '+d+'">＋</button></header>'+items.map(t=>card(t,true)).join('')+(!items.length?'<p class="free">Espacio libre</p>':'')+'</div>';}).join('')+'</div>';}
const start=monday(iso(new Date(dt(anchor).getFullYear(),dt(anchor).getMonth(),1)));return s+'<div class="month-grid">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>'<div class="weekday">'+d+'</div>').join('')+Array.from({length:42},(_,i)=>{let d=add(start,i);return '<div class="month-day '+(d.slice(0,7)!==anchor.slice(0,7)?'other-month ':'')+(d===today()?'is-today':'')+'"><button class="day-number" onclick="newTask(\''+d+'\')">'+dt(d).getDate()+'</button>'+sorted(tasks.filter(active).filter(matches).filter(t=>t.date===d)).map(t=>'<button class="month-task '+t.area+'" data-edit="'+esc(t.id)+'">#'+t.number+' '+esc(t.title)+'</button>').join('')+'</div>';}).join('')+'</div><p class="footnote">Las fechas iniciales son sugerencias, no plazos confirmados.</p>';}
let total=tasks.filter(active).filter(t=>t.kind==='Compra'&&t.cost).reduce((n,t)=>n+Number(t.cost),0);return (view==='Compras'?'<div class="shopping-summary"><strong>S/ '+total.toFixed(2)+'</strong><span>Total estimado con monto. '+tasks.filter(active).filter(t=>t.kind==='Compra'&&!t.cost).length+' compras sin cotizar. S/ 300–400 figura como nota de referencia para M.2 + case.</span></div>':'')+list.map(t=>card(t)).join('')+(!list.length?'<div class="empty"><span>✓</span><h3>Todo despejado por aquí</h3><p>Mira tu semana o asigna fecha a algo de Sin fecha.</p></div>':'');}
function render(){const live=tasks.filter(active),done=tasks.filter(t=>t.status==='Hecho').length;document.querySelector('#app').innerHTML='<div class="shell"><aside class="sidebar"><a class="brand" href="#"><span class="brand-icon">u.</span><span>uli<span class="brand-light">organiza</span><small>MI ESPACIO PERSONAL</small></span></a><p class="nav-label">TU ORGANIZACIÓN</p><nav>'+V.map((v,i)=>'<button class="'+(view===v?'selected':'')+'" data-view="'+v+'"><span class="navico">'+I[i]+'</span>'+v+(v==='Sin fecha'?'<span class="nav-count">'+live.filter(t=>!t.date).length+'</span>':'')+'</button>').join('')+'</nav><div class="divider"></div><p class="nav-label">TUS ESPACIOS</p>'+A.map(a=>'<button class="space '+(area===a?'active':'')+'" data-area="'+a+'">◦ '+a+'<span>'+live.filter(t=>t.area===a).length+'</span></button>').join('')+'<div class="sidebar-bottom"><div class="avatar">UC</div><div><strong>Ulianov Cuba</strong><small>Un poco más de calma.</small></div><button onclick="help()">?</button></div></aside><main><header class="topbar"><span><span class="breadcrumb">Mi espacio</span> / '+view+'</span><div class="top-actions"><span class="cloud local-badge">◉ Guardado en este navegador</span><button class="icon-button" onclick="help()" aria-label="Ayuda">?</button></div></header><div class="page"><div class="page-heading"><div><div class="eyebrow">'+label(today(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div><h1>'+({Hoy:'Menos vueltas. Más claridad.',Semana:'Tu semana, con intención.',Mes:'Un mes con espacio para todo.',Todo:'Todo en un solo lugar.',Compras:'Compra con calma.','Sin fecha':'Fuera de tu cabeza.',Hechas:'Mira cuánto has avanzado.',Archivo:'Lo que dejaste a un lado.'}[view])+'</h1><p>Anota una vez. Tu día, tu semana y tu mes se organizan juntos.</p></div><button class="primary" onclick="newTask(view===\'Hoy\'?today():\'\')">＋ Nueva tarea</button></div>'+(warning?'<div class="alert" role="alert">'+esc(warning)+'</div>':'')+(notice?'<div class="toast" role="status">'+esc(notice)+'<button onclick="notice=\'\';render()" aria-label="Cerrar aviso">×</button></div>':'')+'<section class="overview"><div class="welcome"><span class="pill">UN SOLO SISTEMA, TODAS TUS IDEAS</span><h2>Tu mente es para crear.<br>No para recordarlo todo.</h2><p>Universidad, VayoTech y tu vida personal.<br>Cada pendiente tiene su propio lugar.</p><span class="welcome-mark" aria-hidden="true">✳</span></div><div class="stat"><span>Pendientes</span><strong>'+live.length+'</strong><small>paso a paso</small></div><div class="stat"><span>Prioridad alta</span><strong class="orange">'+live.filter(t=>t.priority==='Alta').length+'</strong><small>empieza por aquí</small></div><div class="stat"><span>Completadas</span><strong class="green">'+done+'</strong><small>también cuenta el avance</small></div></section><form class="quick" id="quick"><span>＋</span><input aria-label="Captura rápida" placeholder="¿Qué tienes en mente? Anótalo aquí y organízalo después…" maxlength="300" required><button>Anotar ↵</button></form><div class="content-layout"><section class="workspace"><div class="workspace-title"><h2>'+({Hoy:'Tu enfoque de hoy',Semana:'Planificador semanal',Mes:'Planificador mensual',Todo:'Lista única de pendientes',Compras:'Tu lista de compras','Sin fecha':'Bandeja de entrada',Hechas:'Tareas realizadas',Archivo:'Archivadas'}[view])+'</h2><div class="tools"><button onclick="window.print()" aria-label="Imprimir" title="Imprimir vista rellenada">▤</button><button onclick="exportJSON()" title="Descargar respaldo" aria-label="Exportar respaldo">↓</button></div></div><div class="filters"><label class="search">⌕ <input id="search" placeholder="Buscar pendiente o número…" aria-label="Buscar pendiente" value="'+esc(query)+'"></label><label class="area-filter"><select id="areaFilter" aria-label="Filtrar por espacio">'+options(['Todas',...A],area)+'</select></label></div><div id="workspaceBody">'+content()+'</div><div class="workspace-footer"><span>Una sola lista · numeración permanente</span><button onclick="selectView(\'Sin fecha\')">Organizar sin fecha ↗</button></div></section><aside class="right-panel"><section class="focus-note"><span class="eyebrow">POCO A POCO</span><h3>Tus 3 siguientes pasos</h3><p>Una propuesta para empezar.<br>Tú decides el ritmo.</p>'+sorted(live.filter(t=>t.priority==='Alta')).slice(0,3).map((t,i)=>'<button data-edit="'+esc(t.id)+'"><b>0'+(i+1)+'</b><span>'+esc(t.title)+'<small>'+t.area+'</small></span><span>↗</span></button>').join('')+'</section><section class="paper-note"><span>UNA IDEA PARA HOY</span><h3>No hace falta<br>hacerlo todo hoy.</h3><p>Elige hasta 3 prioridades. Lo demás sigue a salvo en tu lista.</p><span class="scribble">una cosa a la vez ↗</span></section><section class="backup-box"><h3>Tu agenda también es tuya</h3><p>Esta versión guarda localmente. Para pasarla al otro dispositivo, exporta e importa un respaldo.</p><button onclick="exportJSON()">↓ Descargar respaldo</button><button onclick="document.querySelector(\'#importFile\').click()">↥ Importar respaldo</button><button onclick="exportICS()">▦ Exportar calendario (.ics)</button><button onclick="exportList()">☷ Descargar lista numerada</button><button onclick="selectView(\'Hechas\')">✓ Ver realizadas</button><button onclick="selectView(\'Archivo\')">▧ Ver archivo</button><small>Necesitas conservar el mismo archivo y navegador para mantener el guardado local. No hay sincronización automática ni notificaciones.</small></section></aside></div><footer class="page-footer">Hecho para tener más espacio mental.<button onclick="help()">Cómo funciona</button><a href="https://github.com/72008081-pixel/uli-organiza" target="_blank" rel="noreferrer">Mi repositorio ↗</a></footer></div></main></div>';document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>selectView(el.dataset.view));document.querySelectorAll('[data-area]').forEach(el=>el.onclick=()=>selectArea(el.dataset.area));bindTasks();document.querySelector('#quick').onsubmit=e=>{e.preventDefault();const title=e.target.querySelector('input').value.trim();if(!title)return;const t={id:crypto.randomUUID?crypto.randomUUID():'task-'+Date.now(),number:Math.max(0,...tasks.map(t=>t.number))+1,title,area:'Personal',kind:'Tarea',date:'',deadline:'',priority:'Media',status:'Pendiente',notes:'',source:'Captura rápida',repeat:'',cost:'',proposed:false};persist([...tasks,t],'Anotado una vez. Está en Sin fecha.');};document.querySelector('#search').oninput=e=>{query=e.target.value;document.querySelector('#workspaceBody').innerHTML=content();bindTasks();};document.querySelector('#areaFilter').onchange=e=>{area=e.target.value;document.querySelector('#workspaceBody').innerHTML=content();bindTasks();};}
function bindTasks(){document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>edit(el.dataset.edit));document.querySelectorAll('[data-complete]').forEach(el=>el.onclick=()=>complete(el.dataset.complete));}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportJSON(){download('uli-agenda-'+today()+'.json',JSON.stringify({format:'uli-agenda-v1',tasks},null,2));}
document.querySelector('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='uli-agenda-v1'||!Array.isArray(data.tasks)||data.tasks.length>2000||!data.tasks.every(valid)||new Set(data.tasks.map(t=>t.id)).size!==data.tasks.length)throw Error('Respaldo no válido');if(!confirm('Agregar tareas nuevas y actualizar las que tengan el mismo ID con este respaldo, ¿continuar?'))return;const merged=new Map(tasks.map(t=>[t.id,t]));for(const t of data.tasks)merged.set(t.id,{...t,proposed:!!t.proposed});persist([...merged.values()],'Respaldo importado');}catch(err){warning=err.message;render();}finally{e.target.value='';}};
function exportICS(){const escape=s=>s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';let text='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Uli Organiza//ES\r\nCALSCALE:GREGORIAN\r\n';for(const t of tasks.filter(active).filter(t=>t.date)){text+='BEGIN:VEVENT\r\nUID:'+t.id+'@uli-organiza\r\nDTSTAMP:'+stamp+'\r\nDTSTART;VALUE=DATE:'+t.date.replace(/-/g,'')+'\r\nDTEND;VALUE=DATE:'+add(t.date,1).replace(/-/g,'')+'\r\nSUMMARY:'+escape('#'+t.number+' '+t.title)+'\r\nDESCRIPTION:'+escape(t.notes+(t.proposed?' · Fecha sugerida; no plazo confirmado.':''))+'\r\nEND:VEVENT\r\n';}download('uli-agenda.ics',text+'END:VCALENDAR\r\n','text/calendar');}
function exportList(){download('uli-pendientes.txt',tasks.map(t=>t.number+'. ['+(t.status==='Hecho'?'x':' ')+'] '+t.title+' | '+t.area+' | '+t.status+' | '+(t.date||'Sin fecha')+(t.proposed?' (sugerida)':'')+'\n'+t.notes).join('\n\n'),'text/plain');}
function help(){const d=document.querySelector('#help');d.innerHTML='<section class="modal help"><header><h2>Un lugar para todo.</h2><button onclick="document.querySelector(\'#help\').close()" aria-label="Cerrar ayuda">×</button></header><ol><li><b>Anota una vez.</b> La captura rápida guarda en Sin fecha.</li><li><b>Organiza.</b> Toca la tarea y asigna espacio, día, prioridad y plazo real.</li><li><b>Consulta.</b> Hoy, Semana y Mes usan la misma lista. No copies nada entre vistas.</li><li><b>Completa o reprograma.</b> Una tarea recurrente crea la siguiente fecha al marcar la casilla.</li><li><b>Papel opcional.</b> Imprime la semana o el mes ya rellenados.</li><li><b>Guardado local.</b> Se conserva en este navegador. Exporta respaldos; borrar los datos del navegador puede eliminar la agenda.</li><li><b>Otro dispositivo.</b> Importa el JSON exportado. Pulsa Conectar laptop y celular y vincula ambos con la misma clave limitada al repositorio privado. Los cambios se actualizan al volver a la ventana y cada 30 segundos mientras la agenda está abierta.</li></ol><div class="alert neutral">66 registros de 10 fotos. 9 hechos según las marcas. Fechas sugeridas desde el 19/10/2026; no son plazos confirmados. Las palabras inciertas y notas antiguas están en cada tarea.</div><button class="primary" onclick="document.querySelector(\'#help\').close()">Vamos paso a paso ↗</button></section>';d.showModal();}
window.addEventListener('storage',e=>{if(e.key===KEY&&!document.querySelector('#editor').open){try{const next=JSON.parse(e.newValue);if(next.tasks.every(valid)){tasks=next.tasks;render();}}catch{}}});
render();
</script><script src="sync-core.js?v=1"></script><script src="sync.js?v=2"></script></body></html>
